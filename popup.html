<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>ADBlockBuster</title>
  <link rel="stylesheet" href="css/popup.css" />
</head>
<body>
<div class="header">
  <img src="icons/images.png" alt="Logo" class="logo" />
  <span class="title">ADBlockBuster</span>
</div>

<!-- 룰셋 버전 정보 -->
<div id="updateContainer" class="update-container">
  <div class="version-row">
    <span class="version-label">현재 EasyList 버전</span>
    <span id="rulesetVersion" class="version-value">-</span>
  </div>
  <button id="checkUpdateBtn">최신 버전 확인</button>
  <div id="updateStatus" class="update-status"></div>
  <p class="update-note">최신 EasyList를 반영하려면 배포 전에 `node js/cicd/dnr_generator.js`를 실행하세요.</p>
</div>

<!-- 광고 전체 차단 토글 -->
<div class="toggle-container">
  <span class="toggle-label">광고 차단 비활성화</span>
  <label class="toggle-switch">
    <input type="checkbox" id="globalBlockToggle">
    <span class="slider"></span>
  </label>
</div>

<!-- 현재 사이트 허용 토글 -->
<div class="toggle-container">
  <span class="toggle-label">현재 사이트 허용</span>
  <label class="toggle-switch">
    <input type="checkbox" id="whitelistToggle">
    <span class="slider"></span>
  </label>
</div>

<div class="card">
  <div class="card-title">총 차단된 광고 수</div>
  <div class="ad-count" id="adCount">0</div>
  <ul class="domain-list" id="domainStats"></ul>
  <button id="resetStatsBtn" class="reset-btn">카운트 초기화</button>
</div>

<button class="settings-btn" id="goToSettingsBtn">설정</button>

<!-- 팝업 로직 -->
<script type="module" src="js/popup.js"></script>
</body>
</html>
