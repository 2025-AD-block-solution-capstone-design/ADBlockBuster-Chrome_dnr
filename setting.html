<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>설정 - ADBlockBuster</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="css/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/setting.css">
</head>
<body class="bg-light">
<div class="container-fluid h-100">
  <div class="row h-100">
    <!-- Sidebar -->
    <aside class="col-md-3 col-lg-2 px-0 bg-dark">
      <div class="d-flex flex-column h-100 text-white p-3">
        <!-- Logo -->
        <div class="d-flex align-items-center mb-4 pb-3 border-bottom border-secondary">
          <img src="icons/images.png" alt="Logo" class="me-2" width="28" height="28" />
          <span class="fs-5 fw-bold">ADBlockBuster</span>
        </div>
        
        <!-- Navigation -->
        <nav class="nav nav-pills flex-column">
          <button id="menu-block-settings" class="nav-link text-white border-0 bg-transparent text-start mb-2 active">
            <i class="bi bi-shield-check me-2"></i>차단 설정
          </button>
          <button id="menu-whitelist" class="nav-link text-white border-0 bg-transparent text-start">
            <i class="bi bi-list-check me-2"></i>화이트리스트 관리
          </button>
        </nav>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="col-md-9 col-lg-10 px-md-4">
      <div class="py-4">
        <!-- Update Section -->
        <div class="row mb-4">
          <div class="col-12">
            <div class="card">
              <div class="card-header bg-primary text-white">
                <h6 class="mb-0"><i class="bi bi-arrow-clockwise me-2"></i>룰셋 업데이트</h6>
              </div>
              <div class="card-body">
                <div id="updateContainer">
                  <button id="checkUpdateBtn" class="btn btn-outline-primary">
                    <i class="bi bi-search me-1"></i>업데이트 확인
                  </button>
                  
                  <div id="availableContainer" class="mt-3" hidden>
                    <div class="alert alert-success" role="alert">
                      <i class="bi bi-info-circle me-2"></i>
                      <span id="updateLabel">새로운 룰셋이 있습니다.</span>
                      <div class="mt-2">
                        <button id="performUpdateBtn" class="btn btn-success">
                          <i class="bi bi-download me-1"></i>업데이트 실행
                        </button>
                      </div>
                    </div>
                  </div>
                  
                  <div id="updateStatus" class="mt-2 text-muted"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Block Settings Section -->
        <section id="block-settings" class="setting-section">
          <div class="card">
            <div class="card-header">
              <h5 class="mb-0"><i class="bi bi-shield-check me-2"></i>전체 차단 설정</h5>
            </div>
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center">
                <div>
                  <label class="form-label fw-medium mb-1">광고 차단 기능</label>
                  <div class="small text-muted">모든 사이트에서 광고를 차단합니다</div>
                </div>
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" id="globalBlockToggle" role="switch">
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- Whitelist Management Section -->
        <section id="whitelist-management" class="setting-section" style="display: none;">
          <div class="card">
            <div class="card-header">
              <h5 class="mb-0"><i class="bi bi-list-check me-2"></i>화이트리스트 관리</h5>
            </div>
            <div class="card-body">
              <p class="text-muted mb-3">광고 차단을 제외할 사이트를 관리할 수 있습니다.</p>
              
              <form id="whitelistForm" class="mb-3">
                <div class="input-group">
                  <input type="text" id="whitelistInput" class="form-control" 
                         placeholder="사이트 주소 입력 (예: example.com)" required />
                  <button type="submit" class="btn btn-primary">
                    <i class="bi bi-plus-lg me-1"></i>추가
                  </button>
                </div>
              </form>
              
              <!-- 전체 삭제 버튼 -->
              <div class="d-flex justify-content-end mb-3">
                <button id="clearAllWhitelistBtn" class="btn btn-outline-danger btn-sm" style="display: none;">
                  <i class="bi bi-trash3 me-1"></i>전체 삭제
                </button>
              </div>
              
              <div id="whitelistList" class="whitelist-list">
                <!-- 화이트리스트 항목들이 동적으로 추가됩니다 -->
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
</div>

<!-- SparkMD5: MD5 해시 계산용 -->
<script src="js/libs/spark-md5.min.js"></script>
<!-- Bootstrap JS -->
<script src="js/libs/bootstrap.bundle.min.js"></script>
<!-- 설정 화면 로직 -->
<script type="module" src="js/setting.js"></script>
</body>
</html>
